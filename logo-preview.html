<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drify — Logo Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #FAF6EE;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 64px;
      font-family: -apple-system, sans-serif;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #4B2E1E;
    }
    .logo-text {
      font-family: 'Nunito', -apple-system, sans-serif;
      font-weight: 700;
      font-size: 66px;
      letter-spacing: -0.5px;
      color: #4B2E1E;
      line-height: 1;
    }

    .variant {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #96766A;
    }

    .dark-bg {
      background: #3D2E22;
      padding: 40px 56px;
      border-radius: 20px;
    }
    .dark-bg .logo-text { color: #FAF6EE; }
  </style>
</head>
<body>

  <!-- ══ Grande version ══ -->
  <div class="variant">
    <span class="label">Logo — Grande taille</span>
    <div class="logo">
      <svg width="88" height="98" viewBox="0 0 36 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M2,38 L2,16 L18,4 L34,16 L34,38" stroke="#4B2E1E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M18,19 C23.5,19 26,23 26,27 C26,33 22.5,36.5 18,38 C13.5,36.5 10,33 10,27 C10,23 12.5,19 18,19 Z" stroke="#4B2E1E" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="18" cy="23" r="2.5" stroke="#4B2E1E" stroke-width="2.2"/>
      </svg>
      <span class="logo-text">Drify</span>
    </div>
  </div>

  <!-- ══ Taille navigation (28px) ══ -->
  <div class="variant">
    <span class="label">Logo — Navigation (nav bar)</span>
    <div class="logo">
      <svg width="28" height="31" viewBox="0 0 36 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M2,38 L2,16 L18,4 L34,16 L34,38" stroke="#4B2E1E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M18,19 C23.5,19 26,23 26,27 C26,33 22.5,36.5 18,38 C13.5,36.5 10,33 10,27 C10,23 12.5,19 18,19 Z" stroke="#4B2E1E" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="18" cy="23" r="2.5" stroke="#4B2E1E" stroke-width="2.2"/>
      </svg>
      <span class="logo-text" style="font-size:18px;">Drify</span>
    </div>
  </div>

  <!-- ══ Version sombre ══ -->
  <div class="variant">
    <span class="label">Logo — Fond sombre</span>
    <div class="dark-bg">
      <div class="logo">
        <svg width="52" height="58" viewBox="0 0 36 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M2,38 L2,16 L18,4 L34,16 L34,38" stroke="#FAF6EE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M18,19 C23.5,19 26,23 26,27 C26,33 22.5,36.5 18,38 C13.5,36.5 10,33 10,27 C10,23 12.5,19 18,19 Z" stroke="#FAF6EE" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="18" cy="23" r="2.5" stroke="#FAF6EE" stroke-width="2.2"/>
        </svg>
        <span class="logo-text" style="font-size:42px; color:#FAF6EE;">Drify</span>
      </div>
    </div>
  </div>

  <!-- ══ Icône seule (favicon / app icon) ══ -->
  <div class="variant">
    <span class="label">Icône seule</span>
    <svg width="64" height="64" viewBox="0 0 36 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M2,38 L2,16 L18,4 L34,16 L34,38" stroke="#4B2E1E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M18,18.5 A5.5,5.5 0 0,1 23.5,24 L18,38 L12.5,24 A5.5,5.5 0 0,0 18,18.5 Z" stroke="#4B2E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="18" cy="24" r="2" stroke="#4B2E1E" stroke-width="2.2"/>
    </svg>
  </div>

</body>
</html>
